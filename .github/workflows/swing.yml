name: Free ICT Swing Brief - NY Close

on:
  schedule:
    # Daily Swing: 21:00 UTC = 10 PM London BST (summer) / 10 PM GMT = 22:00 UTC in winter
    # We run twice to cover both: 21:00 UTC and 22:00 UTC, Mon-Fri
    - cron: '0 21 * * 1-5'
    - cron: '0 22 * * 1-5'
    # Weekly Positional: Sunday 21:00 UTC = 10 PM BST / 22:00 UTC = 10 PM GMT
    - cron: '0 21 * * 0'
    - cron: '0 22 * * 0'
  workflow_dispatch: # Allows manual run from GitHub UI for testing

jobs:
  swing-analysis:
    if: github.event.schedule == '0 21 * * 1-5' || github.event.schedule == '0 22 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: |
          pip install yfinance pandas requests google-generativeai
          
      - name: Run Swing SMC Bot - NY Close
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python swing_smc_bot.py --now

  positional-analysis:
    if: github.event.schedule == '0 21 * * 0' || github.event.schedule == '0 22 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: |
          pip install yfinance pandas requests google-generativeai
          
      - name: Run Positional SMC Bot - Weekly Close
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python positional_smc_bot.py --now
